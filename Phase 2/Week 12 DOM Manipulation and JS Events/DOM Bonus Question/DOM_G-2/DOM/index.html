<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<form id="themeChoice" action="#" method="POST">
			<div class="form-values">
				<p>
					Choose the color your want<br />
					<input type="radio" id="blue" name="theme" value="blue" />
					<label for="male">Blue</label><br />

					<input type="radio" id="green" name="theme" value="green" />
					<label for="female">Green</label><br />

					<input type="radio" id="purple" name="theme" value="purple" />
					<label for="other">Purple</label><br />
					<input type="radio" id="sunny" name="theme" value="sunny" />
					<label for="other">Sunny mode</label><br />
					<input type="radio" id="nightmode" name="theme" value="nightmode" />
					<label for="other">Night mode</label><br />
					<input type="radio" id="white" name="theme" value="white" />
					<label for="other">white mode</label><br />
				</p>
			</div>
		</form>
<br>
<hr>
<h5>Increase Decrease </h5> 
<br>
		<form
			action=""
			id="counter"
			style="display: flex; width: 100px; justify-content: space-between">

			<button id="minus">-</button>
			<div id="result">0</div>
			<button id="plus">+</button>

		</form>

		<br>
		<br>
        <span id="span"></span>
		<br>
		<br>
		<hr>

		<form id="form" action="" method="post">
			<h3>Login</h3>
			<input type="text" name="user-name" placeholder="User Name"  id="fullName"/>
			<br /><br />
			<input type="text" name="password" placeholder="Password" id="password"/>
			<br /><br />
			<button type="submit">Submit</button>
			<div id="message"></div>
		</form>

		<script src="script.js"></script>
	</body>
</html>
