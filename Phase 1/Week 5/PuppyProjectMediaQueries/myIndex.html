<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" initial-scale=1.0">
  <title>responsive web dev</title>
  <link rel="stylesheet" href="./css/myStyle.css">
</head>

<body>
  <header>
    <div class="container">
      <div class="blue-BG">
        Puppy lovers page
      </div>
    </div>
  </header>

  <section id="banner">
    <div>
      <img src="./images/banner-puppies.jpg" alt="">
    </div>
  </section>

  <section class="top-container">
    <div class="container">
      <div class="puppy-container">
        <img src="./images/puppy-1.jpg" alt="">
      </div>
      <div class="puppy-container middle-container">
        <div class=" middle-puppy">
          Puppy missing here!!
        </div>
      </div>
      <div class="puppy-container">
        <img src="./images/puppy-2.jpg" alt="">
      </div>
    </div>
  </section>

  <section class="vertical-puppies-section">
    <div class="container">
      <div class="section-title">
        More puppies
      </div>
      <div class="vertical-puppies-wrapper">
        <div class="vertical-puppies-left">
          <img src="./images/puppy-3.jpg" alt="">
        </div>
        <div class="vertical-puppies-right">
          <img src="./images/puppy-4.jpg" alt="">
        </div>
      </div>
    </div>
  </section>



  <footer>
    <div>
      Developed by: salih
    </div>
  </footer>
</body>

</html>
